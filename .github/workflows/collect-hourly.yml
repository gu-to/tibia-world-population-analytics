name: Collect world population hourly

on:
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tibia-public-data-writer
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out application code from main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-collector.txt

      - name: Install collector dependencies
        run: python -m pip install -r requirements-collector.txt

      - name: Prepare data branch worktree
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch origin data
            git worktree add -b data ../tibia-data origin/data
          else
            git worktree add -b data ../tibia-data HEAD
          fi

      - name: Collect and validate one source observation
        shell: bash
        run: |
          python -m src.pipeline \
            --root "$GITHUB_WORKSPACE/../tibia-data" \
            --historical-root "$GITHUB_WORKSPACE"

      - name: Commit public data only when changed
        shell: bash
        run: |
          set -euo pipefail
          git -C ../tibia-data add -- data/live data/audit data/reference
          if git -C ../tibia-data diff --cached --quiet; then
            echo "No new observation or metadata change; no commit needed."
            exit 0
          fi
          git -C ../tibia-data config user.name "github-actions[bot]"
          git -C ../tibia-data config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          timestamp=$(date -u +"%Y-%m-%d %H:%M UTC")
          git -C ../tibia-data commit -m "data: collect world population $timestamp"
          git -C ../tibia-data push origin HEAD:data

