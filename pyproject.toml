[project]
name = "tibia-world-population-analytics"
version = "0.2.0"
description = "Local historical analytics for Tibia world populations"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas>=2.2,<3.1",
    "plotly>=5.24,<7",
    "requests>=2.32,<3",
    "streamlit>=1.50,<2",
    "pyarrow>=17,<26",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", ".uv-cache", ".uv-python", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.3,<5",
    "pytest>=8.3,<10",
    "ruff>=0.8,<1",
]
